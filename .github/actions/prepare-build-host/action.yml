name: Prepare Linux build storage
description: Reserve space for native kernel sources and full image artifacts
runs:
  using: composite
  steps:
    - name: Reclaim unused SDK storage on the ephemeral runner
      shell: bash
      run: |
        if [[ "$RUNNER_ENVIRONMENT" != github-hosted || "$RUNNER_OS" != Linux ]]; then
          echo 'ERROR: This storage preparation requires an ephemeral GitHub Linux runner'
          exit 1
        fi
        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
        available=$(df -B1 --output=avail "$GITHUB_WORKSPACE" | tail -1)
        if (( available < 35 * 1024 * 1024 * 1024 )); then
          echo 'ERROR: At least 35 GiB of free build storage is required'
          exit 1
        fi
