# 在 GitHub Actions 上用 armbian/build 构建本板的内核与 bsp 包。
#
# 产出的是 **deb 包**，不是整盘镜像：
#   * 装进设备的更新路径就是 deb（apt / dpkg -i），镜像只在首次刷机用；
#   * 整盘镜像需要 private/ 里的 WiFi 固件（不能进公共仓库），在本机构建。
#
# 每次都是全新 runner：armbian/build 取 main 的 HEAD、内核取 linux-7.2.y 的 HEAD。
# 所以"能不能构建出来"本身就是漂移检测 —— Armbian 那边动了（bump 7.3、驱动闸、
# 补丁栈变化）这里先炸。
#
# 版本号：Armbian 的 VERSION 文件永远是 26.11.0-trunk 这类固定串，每次构建都一样，
# apt 看不到升级。这里追加 日期.运行序号，单调递增（dpkg 比较 debian_revision 段：
# trunk.20260902.5 < trunk.20260909.6）。设备侧仍需 apt pin，见
# userpatches/overlay/bsp-cli/etc/apt/preferences.d/w132d-kernel。
name: build-packages

on:
  workflow_dispatch:
    inputs:
      armbian_ref:
        description: "armbian/build 的分支或提交（默认 main）"
        default: main
      publish:
        description: "同时发布为 GitHub Release"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "userpatches/**"
      - "patches/**"
      - "tools/verify-debs.sh"
      - ".github/workflows/build-packages.yml"
  schedule:
    # 每周一 03:00 UTC：跟上 linux-7.2.y 与 armbian/build 的 HEAD，并发布
    - cron: "0 3 * * 1"

concurrency:
  group: build-packages
  cancel-in-progress: false

jobs:
  packages:
    # 公共仓库可免费用 GitHub 托管的 arm64 runner，本机架构编译不用交叉工具链。
    # 私有仓库没有这个 label，换成 ubuntu-24.04（x86，Armbian 自动交叉编译）即可。
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    permissions:
      contents: write   # 发 Release 要写权限
    steps:
      - name: 取本仓库
        uses: actions/checkout@v4

      - name: 取 armbian/build
        uses: actions/checkout@v4
        with:
          repository: armbian/build
          ref: ${{ inputs.armbian_ref || 'main' }}
          path: armbian-build
          fetch-depth: 1

      - name: userpatches 交给 Armbian
        # Armbian 只认 ${SRC}/userpatches（硬编码）。复制而不软链：compile.sh 会把这个
        # 目录 bind 进它自己起的 Docker 容器，软链在那一层不可靠。
        run: |
          rm -rf armbian-build/userpatches
          cp -a userpatches armbian-build/userpatches

      - name: 版本号
        id: ver
        run: |
          rev="$(cat armbian-build/VERSION).$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}"
          echo "revision=$rev" >> "$GITHUB_OUTPUT"
          echo "REVISION=$rev  (armbian/build $(git -C armbian-build rev-parse --short HEAD))"

      - name: 内核（linux-image / dtb / headers）
        working-directory: armbian-build
        run: |
          ./compile.sh kernel \
            BOARD=w132d BRANCH=edge \
            REVISION=${{ steps.ver.outputs.revision }} \
            KERNEL_CONFIGURE=no SHARE_LOG=no

      - name: bsp（armbian-bsp-cli-w132d-edge：unit、脚本、keymap、apt pin）
        working-directory: armbian-build
        run: |
          ./compile.sh artifact WHAT=armbian-bsp-cli \
            BOARD=w132d BRANCH=edge RELEASE=trixie \
            REVISION=${{ steps.ver.outputs.revision }} \
            KERNEL_CONFIGURE=no SHARE_LOG=no

      - name: 收集并校验
        # 不只看有没有产出：DTB 必须在、板级模块必须在、pstore console 必须开、
        # bsp 里必须有 cookie 服务与 apt pin —— 和本机 verify-image 一个思路。
        # verify-dtb 要 fdtget（device-tree-compiler），runner 上默认没有
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y device-tree-compiler
          mkdir -p out/debs
          cp armbian-build/output/debs/*_${{ steps.ver.outputs.revision }}_*.deb out/debs/
          (cd out/debs && sha256sum *.deb > SHA256SUMS && cat SHA256SUMS)
          bash tools/verify-debs.sh out/debs

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: w132d-debs-${{ steps.ver.outputs.revision }}
          path: out/debs/
          if-no-files-found: error
          retention-days: 30

      - name: 发布 Release
        if: github.event_name == 'schedule' || inputs.publish == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pkg-${{ steps.ver.outputs.revision }}
          name: 内核与 bsp 包 ${{ steps.ver.outputs.revision }}
          body: |
            armbian/build `${{ inputs.armbian_ref || 'main' }}`，内核 linux-7.2.y HEAD。
            设备上安装：`dpkg -i linux-dtb-*.deb linux-image-*.deb armbian-bsp-cli-w132d-edge_*.deb`
            （已装 apt pin 的设备不会被 apt.armbian.com 的同名包覆盖）。
          files: out/debs/*
