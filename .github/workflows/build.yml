name: W132D build and release

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'
    - cron: '43 2 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: Build target (stable always builds an image)
        type: choice
        options: [kernel, image]
        default: kernel
      channel:
        description: Publication channel
        type: choice
        options: [experimental, stable]
        default: experimental
      initialize_repository:
        description: Allow missing Pages state for the first stable publication
        type: boolean
        default: false

permissions:
  contents: read

# Serialize detection and promotion too, so both upstream updates form one
# candidate and no second deployment can race a successful Pages switch.
concurrency:
  group: w132d-${{ github.event_name == 'pull_request' && github.ref || 'publication' }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.lock.outputs.changed }}
      version: ${{ steps.lock.outputs.version }}
      commit: ${{ steps.lock.outputs.commit }}
      channel: ${{ steps.lock.outputs.channel }}
      target: ${{ steps.lock.outputs.target }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Resolve and lock official inputs
        id: lock
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          CHANNEL: ${{ inputs.channel || 'experimental' }}
          TARGET: ${{ inputs.target || 'kernel' }}
          REF: ${{ github.ref }}
          INITIALIZE: ${{ inputs.initialize_repository || false }}
        run: |
          options=()
          if [[ "$INITIALIZE" == true ]]; then
            [[ "$EVENT" == workflow_dispatch && "$CHANNEL" == stable ]] || { echo 'Initialization requires a manual stable build'; exit 1; }
            options+=(--initialize)
          fi
          if [[ "$EVENT" == schedule ]]; then
            CHANNEL=stable
            options+=(--detect)
          fi
          if [[ "$CHANNEL" == stable ]]; then
            [[ "$REF" == refs/heads/main ]] || { echo 'Stable requires main'; exit 1; }
            TARGET=image
          fi
          tools/w132d fetch --latest --channel "$CHANNEL" --outputs "$GITHUB_OUTPUT" "${options[@]}"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: input-lock
          path: out/manifest.json
          if-no-files-found: error

  checks:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: input-lock
          path: out
      - name: Prepare validation tools
        run: |
          GOBIN="$PWD/cache/check-tools/bin" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          docker build -t w132d-check -f tools/docker/Dockerfile .
      - name: Static checks and behavioral tests
        run: |
          docker run --rm -e CI=true -v "$PWD:/work" -v "$PWD/cache/check-tools/bin/actionlint:/usr/local/bin/actionlint:ro" w132d-check tools/w132d verify static
          docker run --rm -v "$PWD:/work" w132d-check tools/w132d verify tests
      - name: Strict patches, DTB and schema gate
        run: docker run --rm -v "$PWD:/work" w132d-check tools/w132d verify patches --jobs 4
      - uses: actions/upload-artifact@v7
        with:
          name: patch-report
          path: out/${{ needs.prepare.outputs.version }}/patch-verification.json
          if-no-files-found: error

  compile:
    needs: [prepare, checks]
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: ./.github/actions/prepare-build-host
      - uses: actions/download-artifact@v8
        with:
          name: input-lock
          path: out
      - name: Install verification dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y device-tree-compiler gdisk fdisk
      - name: Require a native ARM64 runner
        run: |
          if [[ "$RUNNER_ARCH" != "ARM64" ]]; then
            echo 'ERROR: Kernel and image builds require a native ARM64 runner'
            exit 1
          fi
      - uses: actions/cache@v6
        with:
          path: cache/armbian/*/cache/ccache
          key: ccache-${{ runner.arch }}-${{ needs.prepare.outputs.version }}
          restore-keys: ccache-${{ runner.arch }}-
      - name: Build locked packages or complete image
        env:
          TARGET: ${{ needs.prepare.outputs.target }}
        run: tools/w132d build "$TARGET"
      - uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: out/${{ needs.prepare.outputs.version }}/
          compression-level: 0
          if-no-files-found: error
          retention-days: 30

  flash-tools:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true' && needs.prepare.outputs.target == 'image'
    uses: ./.github/workflows/flash-tools.yml
    with:
      commit: ${{ needs.prepare.outputs.commit }}

  seal:
    needs: [prepare, checks, compile, flash-tools]
    if: >-
      always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
      needs.checks.result == 'success' && needs.compile.result == 'success' &&
      (needs.flash-tools.result == 'success' || needs.flash-tools.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: ./.github/actions/prepare-build-host
      - uses: actions/download-artifact@v8
        with:
          name: build-output
          path: out/candidate
      - uses: actions/download-artifact@v8
        with:
          name: patch-report
          path: out/candidate
      - uses: actions/download-artifact@v8
        if: needs.prepare.outputs.target == 'image'
        with:
          pattern: rkdeveloptool-*
          path: out/flash-tools
          merge-multiple: true
      - name: Verify and seal immutable candidate
        run: |
          sudo apt-get update
          sudo apt-get install -y device-tree-compiler gdisk fdisk
          tools/w132d release prepare --directory out/candidate
      - uses: actions/upload-artifact@v7
        with:
          name: verified-candidate
          path: out/candidate/
          compression-level: 0
          if-no-files-found: error
          retention-days: 90

  publish:
    needs: [prepare, seal]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: write
      pages: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: verified-candidate
          path: out/candidate
      - name: Preserve immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: tools/w132d release immutable --directory out/candidate --repository "$REPOSITORY"
      - name: Sign retained APT distributions
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          APT_SIGNING_FINGERPRINT: ${{ vars.APT_SIGNING_FINGERPRINT }}
        run: |
          test -n "$APT_SIGNING_KEY" && test -n "$APT_SIGNING_FINGERPRINT"
          export GNUPGHOME
          GNUPGHOME=$(mktemp -d)
          trap 'rm -rf "$GNUPGHOME"' EXIT
          printf '%s\n' "$APT_SIGNING_KEY" | gpg --batch --quiet --import
          tools/w132d repo --directory out/candidate --output out/pages --key "$APT_SIGNING_FINGERPRINT"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out/pages
      - name: Deploy signed APT repository
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Promote only after the new APT state is visible
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: tools/w132d release latest --directory out/candidate --repository "$REPOSITORY"
