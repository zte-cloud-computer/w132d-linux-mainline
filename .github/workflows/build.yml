# 在 GitHub Actions 上用 armbian/build 构建本板的 deb 包（内核、U-Boot、bsp）与整盘镜像。
#
# push 到 main：出 deb，签名后整体替换到 Release `apt` 的附件（设备的 apt 源）。
# 打 v* 标签：再出整盘镜像与 fnOS 镜像，校验后连刷写脚本打成发布包，建正式 Release；deb 同样发到 apt 源。
# 手动触发：勾 publish 才发 apt；勾 build_fnos 单独构建 fnOS 镜像。
# 版本号追加 日期.运行序号 才能让 apt 看到升级（Armbian 的 VERSION 是固定串）。
name: build

on:
  workflow_dispatch:
    inputs:
      armbian_ref:
        description: "armbian/build 的分支或提交（默认 main）"
        default: main
      publish:
        description: "发到 apt 源（Release apt）"
        type: boolean
        default: false
      build_fnos:
        description: "构建 fnOS 镜像"
        type: boolean
        default: false
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "userpatches/**"
      - "patches/**"
      - "tools/**"
      - ".github/workflows/build.yml"

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  packages:
    # 公共仓库可免费用 GitHub 托管的 arm64 runner，本机架构编译不用交叉工具链。
    # 私有仓库没有这个 label，换成 ubuntu-24.04（x86，Armbian 自动交叉编译）即可。
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    permissions:
      contents: write   # 更新 apt Release 的附件要写权限
    outputs:
      revision: ${{ steps.ver.outputs.revision }}
      debs_artifact: w132d-debs-${{ steps.ver.outputs.revision }}
    steps:
      - name: 取本仓库
        uses: actions/checkout@v7

      - name: 取 armbian/build
        uses: actions/checkout@v7
        with:
          repository: armbian/build
          ref: ${{ inputs.armbian_ref || 'main' }}
          path: armbian-build
          fetch-depth: 1

      - name: userpatches 交给 Armbian
        # Armbian 只认 ${SRC}/userpatches（硬编码）。复制而不软链：compile.sh 会把这个
        # 目录 bind 进它自己起的 Docker 容器，软链在那一层不可靠。
        run: |
          rm -rf armbian-build/userpatches
          cp -a userpatches armbian-build/userpatches

      - name: 版本号
        id: ver
        run: |
          rev="$(cat armbian-build/VERSION).$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}"
          echo "revision=$rev" >> "$GITHUB_OUTPUT"
          echo "REVISION=$rev  (armbian/build $(git -C armbian-build rev-parse --short HEAD))"

      - name: 恢复 ccache
        # key 带 run_id：每次存新的一份，恢复最近一份
        uses: actions/cache/restore@v6
        with:
          path: armbian-build/cache/ccache
          key: ccache-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: ccache-${{ runner.arch }}-

      - name: 内核（linux-image / dtb / headers）
        working-directory: armbian-build
        run: |
          ./compile.sh kernel \
            BOARD=w132d BRANCH=edge \
            REVISION=${{ steps.ver.outputs.revision }} \
            USE_CCACHE=yes PRIVATE_CCACHE=yes \
            KERNEL_CONFIGURE=no SHARE_LOG=no
          sudo ccache -d cache/ccache -s 2>/dev/null || true

      - name: U-Boot（linux-u-boot-w132d-edge：rkbin DDR/BL31 blob + 主线 U-Boot 2026.07）
        working-directory: armbian-build
        run: |
          ./compile.sh uboot \
            BOARD=w132d BRANCH=edge \
            REVISION=${{ steps.ver.outputs.revision }} \
            USE_CCACHE=yes PRIVATE_CCACHE=yes \
            KERNEL_CONFIGURE=no SHARE_LOG=no

      - name: bsp（armbian-bsp-cli-w132d-edge：unit、脚本、keymap、apt pin）
        working-directory: armbian-build
        run: |
          ./compile.sh artifact WHAT=armbian-bsp-cli \
            BOARD=w132d BRANCH=edge RELEASE=trixie \
            REVISION=${{ steps.ver.outputs.revision }} \
            KERNEL_CONFIGURE=no SHARE_LOG=no

      - name: 整盘镜像（公开：仓库里没有 customize-image.sh）
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: armbian-build
        run: |
          ./compile.sh build \
            BOARD=w132d BRANCH=edge RELEASE=trixie \
            BUILD_MINIMAL=yes BUILD_DESKTOP=no KERNEL_CONFIGURE=no \
            REVISION=${{ steps.ver.outputs.revision }} \
            USE_CCACHE=yes PRIVATE_CCACHE=yes SHARE_LOG=no
          ls -la output/images/; df -h / | tail -1

      - name: 保存 ccache
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" armbian-build/cache/ccache 2>/dev/null || true

      - uses: actions/cache/save@v6
        if: always()
        with:
          path: armbian-build/cache/ccache
          key: ccache-${{ runner.arch }}-${{ github.run_id }}

      - name: 收集并校验
        # 不只看有没有产出：DTB 必须在、板级模块必须在、pstore console 必须开、
        # bsp 里必须有 cookie 服务与 apt pin、U-Boot 里必须有针孔键 —— 和本机 verify-image 一个思路。
        # verify-dtb 要 fdtget（device-tree-compiler），runner 上默认没有
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y device-tree-compiler
          mkdir -p out/debs
          # 只收本板那六个包；镜像构建还会顺带出 armbian-firmware/armbian-config 等通用包，不能进 apt 源
          for p in linux-image-edge-rockchip64 linux-dtb-edge-rockchip64 linux-headers-edge-rockchip64 \
                   linux-libc-dev-edge-rockchip64 linux-u-boot-w132d-edge armbian-bsp-cli-w132d-edge; do
            cp armbian-build/output/debs/${p}_${{ steps.ver.outputs.revision }}_*.deb out/debs/
          done
          (cd out/debs && sha256sum *.deb > SHA256SUMS && cat SHA256SUMS)
          bash tools/verify-debs.sh out/debs

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: w132d-debs-${{ steps.ver.outputs.revision }}
          path: out/debs/
          if-no-files-found: error
          retention-days: 30

      - name: 校验镜像并打发布包
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          W132D_ROOT: ${{ github.workspace }}
        run: |
          sudo apt-get -qq install -y gdisk qemu-user-static
          bash tools/fetch-inputs.sh --loader-only
          img=$(ls -t armbian-build/output/images/*.img | head -1)
          sudo -E bash tools/verify-image.sh "$img"
          W132D_RELEASE_STAMP=${GITHUB_REF_NAME#v} bash tools/make-release.sh "$img" out/release
          ls -la out/release/

      - name: 发布镜像 Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=${GITHUB_REF_NAME}
          notes="整盘镜像 + 刷写脚本（macOS/Linux、Windows）+ loader，刷写步骤见包内 README.md。
          内核 linux-7.2.y HEAD，armbian/build \`${{ inputs.armbian_ref || 'main' }}\`，包版本 ${{ steps.ver.outputs.revision }}。
          刷好后 \`apt update && apt full-upgrade\` 即可跟进后续内核更新。"
          gh release create "$tag" --title "W132D Armbian $tag" --notes "$notes" out/release/*.zip out/release/SHA256SUMS

      - name: 发布 apt 源（Release `apt` 的附件整体替换）
        if: github.event_name == 'push' || inputs.publish == true
        env:
          GH_TOKEN: ${{ github.token }}
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          REPO: ${{ github.repository }}
        run: |
          [ -n "$APT_SIGNING_KEY" ] || { echo "缺 secret APT_SIGNING_KEY"; exit 1; }
          sudo apt-get -qq install -y apt-utils gnupg
          export GNUPGHOME="$(mktemp -d)"
          printf '%s\n' "$APT_SIGNING_KEY" | gpg --batch --quiet --import
          bash tools/apt-repo.sh out/debs out/apt
          gpgv --keyring "$PWD/userpatches/overlay/bsp-cli/usr/share/keyrings/w132d-archive-keyring.gpg" out/apt/InRelease
          gh release view apt -R "$REPO" >/dev/null 2>&1 || \
            gh release create apt -R "$REPO" --prerelease --latest=false --title "apt 源（滚动更新，附件由 CI 整体替换）" \
              --notes "设备上的 /etc/apt/sources.list.d/w132d.sources 指向这里，不要手动改附件。"
          gh release upload apt -R "$REPO" --clobber out/debs/*.deb out/apt/Packages out/apt/Packages.gz out/apt/Release out/apt/InRelease out/apt/Release.gpg
          keep=" $(cd out/debs && ls *.deb | tr '\n' ' ') Packages Packages.gz Release InRelease Release.gpg "
          for a in $(gh release view apt -R "$REPO" --json assets -q '.assets[].name'); do
            case "$keep" in *" $a "*) ;; *) gh release delete-asset apt "$a" -R "$REPO" -y ;; esac
          done
          gh release edit apt -R "$REPO" --prerelease --notes "设备上的 /etc/apt/sources.list.d/w132d.sources 指向这里，不要手动改附件；设备上 \`apt update && apt full-upgrade\` 即可。当前包版本 ${{ steps.ver.outputs.revision }}（armbian/build \`${{ inputs.armbian_ref || 'main' }}\`，内核 linux-7.2.y HEAD，$(date -u +%FT%TZ)）。手动安装顺序：dtb → image → bsp。"

  fnos:
    # 用 ophub/fnnas 把官方 fnOS Rockchip ARM64 镜像重新打包：替换内核与 DTB 为本项目构建的版本。
    # 打 v* 标签或手动勾选 build_fnos 时才跑。
    needs: packages
    if: startsWith(github.ref, 'refs/tags/v') || inputs.build_fnos == true
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - name: 取本仓库
        uses: actions/checkout@v7

      - name: 下载内核 deb
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.packages.outputs.debs_artifact }}
          path: debs/

      - name: deb 转 ophub 内核格式
        id: ophub_kernel
        run: |
          bash tools/deb-to-ophub-kernel.sh debs/ ophub-kernel/ rockchip
          kver=$(ls ophub-kernel/boot-rockchip-*.tar.gz | sed 's|.*boot-rockchip-||;s|\.tar\.gz||')
          echo "kernel_version=$kver" >> "$GITHUB_OUTPUT"
          echo "内核版本: $kver"

      - name: 取 ophub/fnnas
        uses: actions/checkout@v7
        with:
          repository: ophub/fnnas
          ref: main
          path: fnnas-build

      - name: 注入 W132D 板级配置
        # ophub/fnnas 用 model_database.conf 映射板名到 DTB/U-Boot/平台。
        # W132D 不在上游列表里，追加一行即可；格式与已有 RK3528 条目一致。
        run: |
          conf="fnnas-build/make-fnnas/fnnas-files/common-files/etc/model_database.conf"
          if ! grep -q 'w132d' "$conf"; then
            echo '# ZTE Cloud Computer W132D (added by w132d-linux-mainline CI)' >> "$conf"
            echo 'r790    :ZTE-W132D                                     :rk3528   :rk3528-w132d.dtb                         :NA                           :u-boot.itb                          :idbloader.img                   :2GB-LPDDR4,32G-eMMC,WiFi,1Gb-Nic           :rockchip/all          :rockchip    :rk3528       :extlinux.conf   :w132d-linux-mainline                                 :w132d                     :yes' >> "$conf"
            echo "✅ 已追加 W132D 到 model_database.conf"
            tail -3 "$conf"
          fi

      - name: 放置自定义内核
        # ophub/fnnas 的 renas 会在 make-fnnas/kernel/<kver>/<kver>-<platform>/ 下找内核文件。
        # 把转换好的 tar.gz 放到正确位置，renas 就会跳过下载直接使用。
        run: |
          kver="${{ steps.ophub_kernel.outputs.kernel_version }}"
          dest="fnnas-build/make-fnnas/kernel/${kver}/${kver}-rockchip"
          mkdir -p "$dest"
          cp ophub-kernel/*.tar.gz ophub-kernel/sha256sums "$dest/"
          echo "✅ 内核文件已放置到 $dest"
          ls -la "$dest/"

      - name: 安装构建依赖
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install -y $(curl -fsSL https://ophub.org/ubuntu2604-make-fnnas-depends)

      - name: 下载 fnOS 官方 Rockchip 基础镜像
        id: fnos_base
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: fnnas-build
        run: |
          mkdir -p fnnas-arm64
          # 从 ophub/fnnas 的 fnnas_base_image release 下载最新的 Rockchip 镜像
          latest=$(gh release view fnnas_base_image -R ophub/fnnas --json assets -q \
            '[.assets[] | select(.name | test("rockchip.*\.img\.xz"))] | sort_by(.updatedAt) | reverse | .[0].name' \
            2>/dev/null || true)
          if [ -n "$latest" ] && [ "$latest" != "null" ]; then
            echo "下载: $latest"
            gh release download fnnas_base_image -R ophub/fnnas -p "$latest" -D fnnas-arm64 --clobber
          else
            echo "❌ 找不到 fnOS Rockchip 基础镜像"; exit 1
          fi
          echo "status=success" >> "$GITHUB_OUTPUT"

      - name: 构建 fnOS 镜像
        if: steps.fnos_base.outputs.status == 'success'
        working-directory: fnnas-build
        run: |
          sudo ./renas \
            -b w132d \
            -k ${{ steps.ophub_kernel.outputs.kernel_version }} \
            -a false \
            -n w132d

      - name: 上传 fnOS 镜像
        uses: actions/upload-artifact@v7
        with:
          name: w132d-fnos-${{ needs.packages.outputs.revision }}
          path: fnnas-build/fnnas/out/
          if-no-files-found: error
          retention-days: 30

      - name: 发布 fnOS 镜像
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=${GITHUB_REF_NAME}
          # fnOS 镜像附加到已有的 Release（packages job 已创建）
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" fnnas-build/fnnas/out/*.img.gz --clobber || true
            gh release upload "$tag" fnnas-build/fnnas/out/*.img.xz --clobber || true
          else
            echo "⚠️ Release $tag 不存在，跳过 fnOS 镜像发布（Armbian 镜像 Release 应由 packages job 先创建）"
          fi
