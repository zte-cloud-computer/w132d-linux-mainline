%YAML 1.2
---
$id: http://devicetree.org/schemas/display/rockchip/rockchip,rk3528-dw-hdmi.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#
title: Rockchip DWC HDMI TX Encoder
maintainers:
  - W132D maintainers <tech@wenziwanka.com>
description: |
  The HDMI transmitter is a Synopsys DesignWare HDMI 1.4 TX controller IP
  with a companion PHY IP.
allOf:
  - $ref: ../bridge/synopsys,dw-hdmi.yaml#
  - $ref: /schemas/sound/dai-common.yaml#
properties:
  compatible:
    const: rockchip,rk3528-dw-hdmi
  reg-io-width:
    const: 4
  avdd-0v9-supply:
    description: A 0.9V supply that powers up the SoC internal circuitry. The actual pin name varies between
      the different SoCs and is usually HDMI_TX_AVDD_0V9 or sometimes HDMI_AVDD_1V0.
  avdd-1v8-supply:
    description: A 1.8V supply that powers up the SoC internal circuitry. The pin name on the SoC usually
      is HDMI_TX_AVDD_1V8.
  clocks:
    minItems: 2
    items:
      - {}
      - {}
      - description: The HDMI CEC controller main clock
      - description: Power for GRF IO
      - description: External clock for some HDMI PHY (old clock name, deprecated)
      - description: External clock for some HDMI PHY (new name)
  clock-names:
    minItems: 2
    items:
      - {}
      - {}
      - enum:
          - cec
          - grf
          - vpll
          - ref
      - enum:
          - grf
          - vpll
          - ref
      - enum:
          - vpll
          - ref
  phys:
    maxItems: 1
    description: The HDMI PHY
  phy-names:
    const: hdmi
  pinctrl-names:
    description: The unwedge pinctrl entry shall drive the DDC SDA line low. This is intended to work
      around a hardware errata that can cause the DDC I2C bus to be wedged.
    minItems: 1
    items:
      - const: default
      - const: unwedge
  power-domains:
    maxItems: 1
  ports:
    $ref: /schemas/graph.yaml#/properties/ports
    properties:
      port@0:
        $ref: /schemas/graph.yaml#/properties/port
        description: Input of the DWC HDMI TX
        properties:
          endpoint:
            description: Connection to the VOP
          endpoint@0:
            description: Connection to the VOPB
          endpoint@1:
            description: Connection to the VOPL
      port@1:
        $ref: /schemas/graph.yaml#/properties/port
        description: Output of the DWC HDMI TX
    required:
      - port@0
      - port@1
  rockchip,grf:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: phandle to the GRF to mux vopl/vopb.
  '#sound-dai-cells':
    const: 0
  hpd-gpios:
    maxItems: 1
    description: GPIO0_A2 hot-plug input mirrored into the VO GRF.
required:
  - compatible
  - reg
  - reg-io-width
  - clocks
  - clock-names
  - interrupts
  - ports
  - rockchip,grf
unevaluatedProperties: false
...
