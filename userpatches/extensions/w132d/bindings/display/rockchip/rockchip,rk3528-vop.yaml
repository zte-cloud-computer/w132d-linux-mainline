%YAML 1.2
---
$id: http://devicetree.org/schemas/display/rockchip/rockchip,rk3528-vop.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#
title: Rockchip SoC display controller (VOP2)
description: VOP2 (Video Output Processor v2) is the display controller for the Rockchip series of SoCs
  which transfers the image data from a video memory buffer to an external LCD interface.
maintainers:
  - W132D maintainers <tech@wenziwanka.com>
properties:
  compatible:
    const: rockchip,rk3528-vop
  reg:
    maxItems: 1
  reg-names:
    const: vop
  interrupts:
    minItems: 1
    maxItems: 4
    description: For VOP version under rk3576, the interrupt is shared by several interrupt sources, such
      as frame start (VSYNC), line flag and other interrupt status. For VOP version from rk3576 there
      is a system interrupt for bus error, and every video port has it's independent interrupts for vsync
      and other video port related error interrupts.
  interrupt-names:
    items:
      - const: sys
      - const: vp0
      - const: vp1
      - const: vp2
  clocks:
    maxItems: 3
  clock-names:
    items:
      - const: aclk
      - const: hclk
      - const: dclk_vp0
  rockchip,grf:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: Phandle to GRF regs used for control the polarity of dclk/hsync/vsync of DPI, also used
      for query vop memory bisr enable status, etc.
  rockchip,vo1-grf:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: Phandle to VO GRF regs used for control the polarity of dclk/hsync/vsync of hdmi on rk3588.
  rockchip,vop-grf:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: Phandle to VOP GRF regs used for control data path between vopr and hdmi/edp.
  rockchip,pmu:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: Phandle to PMU GRF used for query vop memory bisr status on rk3588.
  ports:
    $ref: /schemas/graph.yaml#/properties/ports
    patternProperties:
      ^port@[0-3]$:
        $ref: /schemas/graph.yaml#/properties/port
        description: Output endpoint of VP0/1/2/3.
    required:
      - port@0
    unevaluatedProperties: false
  iommus:
    maxItems: 1
  power-domains:
    maxItems: 1
required:
  - compatible
  - reg
  - reg-names
  - interrupts
  - clocks
  - clock-names
  - ports
additionalProperties: false
...
