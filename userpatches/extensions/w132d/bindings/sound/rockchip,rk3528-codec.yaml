%YAML 1.2
---
$schema: http://devicetree.org/meta-schemas/core.yaml#
maintainers:
  - W132D maintainers <tech@wenziwanka.com>
$id: http://devicetree.org/schemas/sound/rockchip,rk3528-codec.yaml#
title: RK3528 internal DAC
allOf:
  - $ref: dai-common.yaml#
properties:
  compatible:
    const: rockchip,rk3528-codec
  reg:
    maxItems: 1
  clocks:
    maxItems: 2
  clock-names:
    items:
      - const: pclk
      - const: mclk
  resets:
    maxItems: 1
  reset-names:
    const: acodec
  pa-ctl-gpios:
    maxItems: 1
    description: External amplifier enable.
  '#sound-dai-cells':
    const: 0
required:
  - compatible
  - reg
  - clocks
  - clock-names
  - resets
  - '#sound-dai-cells'
unevaluatedProperties: false
...
