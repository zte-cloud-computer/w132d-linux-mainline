%YAML 1.2
---
$id: http://devicetree.org/schemas/thermal/rockchip,rk3528-tsadc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#
title: Temperature Sensor ADC (TSADC) on Rockchip SoCs
maintainers:
  - W132D maintainers <tech@wenziwanka.com>
$ref: thermal-sensor.yaml#
properties:
  compatible:
    const: rockchip,rk3528-tsadc
  reg:
    maxItems: 1
  interrupts:
    maxItems: 1
  clocks:
    maxItems: 3
  clock-names:
    items:
      - const: tsadc
      - const: tsadc_tsen
      - const: apb_pclk
  nvmem-cells:
    items:
      - description: cell handle to where the trim's base temperature is stored
      - description: cell handle to where the trim's tenths of Celsius base value is stored
  nvmem-cell-names:
    items:
      - const: trim_base
      - const: trim_base_frac
  resets:
    maxItems: 2
  reset-names:
    items:
      - const: tsadc
      - const: tsadc-apb
  '#address-cells':
    const: 1
  '#size-cells':
    const: 0
  '#thermal-sensor-cells':
    const: 1
  rockchip,grf:
    description: The phandle of the syscon node for the general register file.
    $ref: /schemas/types.yaml#/definitions/phandle
  rockchip,hw-tshut-temp:
    description: The hardware-controlled shutdown temperature value.
    $ref: /schemas/types.yaml#/definitions/uint32
  rockchip,hw-tshut-mode:
    description: The hardware-controlled shutdown mode 0:CRU 1:GPIO.
    $ref: /schemas/types.yaml#/definitions/uint32
    enum:
      - 0
      - 1
  rockchip,hw-tshut-polarity:
    description: The hardware-controlled active polarity 0:LOW 1:HIGH.
    $ref: /schemas/types.yaml#/definitions/uint32
    enum:
      - 0
      - 1
patternProperties:
  '@[0-9a-f]+$':
    type: object
    properties:
      reg:
        maxItems: 1
        description: sensor ID, a.k.a. channel number
      nvmem-cells:
        items:
          - description: handle of cell containing calibration data
      nvmem-cell-names:
        items:
          - const: trim
    required:
      - reg
    unevaluatedProperties: false
required:
  - compatible
  - reg
  - interrupts
  - clocks
  - clock-names
  - resets
unevaluatedProperties: false
...
