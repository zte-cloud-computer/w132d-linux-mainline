# W132D default audio devices use card names because probe ordering may vary.
# rk3528acodec: integrated DAC -> LINEOUT -> 3.5mm output.
# rockchippdmmica: ES7202 analog microphone -> PDM -> capture.
# Softvol adds up to 20 dB digital gain above the ES7202 36 dB analog PGA.
# Adjust with amixer -c rockchippdmmica sset "Mic Boost" 80%; save with alsactl store.

pcm.micboost {
    type softvol
    slave.pcm "plughw:CARD=rockchippdmmica,DEV=0"
    control {
        name "Mic Boost"
        card rockchippdmmica
    }
    min_dB -20.0
    max_dB 20.0
    resolution 81
}

pcm.!default {
    type asym
    playback.pcm "plughw:CARD=rk3528acodec,DEV=0"
    capture.pcm  "micboost"
}

ctl.!default {
    type hw
    card rk3528acodec
}
