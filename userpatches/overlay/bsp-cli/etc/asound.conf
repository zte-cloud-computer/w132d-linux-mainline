# W132D 音频默认设备
#
# 两张声卡的编号取决于探测顺序，重启会换（实测 acodec 一会儿 0 一会儿 1），
# 所以一律按卡名绑定，不用数字：
#   rk3528acodec     —— 片内 DAC -> LINEOUT -> 3.5mm 输出
#   rockchippdmmica  —— ES7202 模拟麦转 PDM -> PDM 控制器 -> 麦克风输入
#
# 录音这边套了一层 softvol：ES7202 的模拟 PGA 只到 36 dB，实测耳麦说话峰值
# 才 -48 dBFS（线控麦离嘴 30cm），太小。补 20 dB 数字增益后峰值约 -28 dBFS。
# 增益是个可调的 mixer 控件，嫌吵/嫌小就改，alsactl store 存盘：
#   amixer -c rockchippdmmica sset "Mic Boost" 80%
# 要原始未加工的信号就直接用 plughw:CARD=rockchippdmmica。

pcm.micboost {
    type softvol
    slave.pcm "plughw:CARD=rockchippdmmica,DEV=0"
    control {
        name "Mic Boost"
        card rockchippdmmica
    }
    min_dB -20.0
    max_dB 20.0
    resolution 81
}

pcm.!default {
    type asym
    playback.pcm "plughw:CARD=rk3528acodec,DEV=0"
    capture.pcm  "micboost"
}

ctl.!default {
    type hw
    card rk3528acodec
}
