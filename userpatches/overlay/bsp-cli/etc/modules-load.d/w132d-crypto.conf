# regdb 签名校验需要 crypto API 的 sha256 shash。
# CONFIG_CRYPTO_SHA256=m 而模块此前从未编出来，导致 cfg80211 报
# "loaded regulatory.db is malformed or signature is missing/invalid"，
# regdomain 卡在 country 00（发射功率受限、部分信道不可用）。
# 注意 CONFIG_CRYPTO_LIB_SHA256=y 只是**库**，不注册 crypto API 的 shash，不顶用。
#
# 内核有 crypto-sha256 别名、能按需自动加载，这里显式加载是为了确定性：
# 保证 systemd-modules-load 早于 cfg80211 初始化把它就位。
sha256
