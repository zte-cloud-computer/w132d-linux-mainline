# W132D 29-key remote: measured NEC codes, address 0x22.
# Additional codes from vendor ir_key8 support the 43-key variant.
# KEY_SETUP is labeled TV; voice audio travels over Bluetooth.
[[protocols]]
name = "w132d"
protocol = "nec"
variant = "nec"

[protocols.scancodes]
0x22dc = "KEY_POWER"
0x228d = "KEY_SETUP"
0x229c = "KEY_MUTE"

0x22ca = "KEY_UP"
0x22d2 = "KEY_DOWN"
0x2299 = "KEY_LEFT"
0x22c1 = "KEY_RIGHT"
0x22ce = "KEY_OK"
0x2295 = "KEY_BACK"
0x2288 = "KEY_HOME"
0x2282 = "KEY_MENU"

0x2280 = "KEY_VOLUMEUP"
0x2281 = "KEY_VOLUMEDOWN"
0x2285 = "KEY_CHANNELUP"
0x2286 = "KEY_CHANNELDOWN"

0x22e5 = "KEY_VOICECOMMAND"
0x22f0 = "KEY_PROG1"

0x2292 = "KEY_1"
0x2293 = "KEY_2"
0x22cc = "KEY_3"
0x228e = "KEY_4"
0x228f = "KEY_5"
0x22c8 = "KEY_6"
0x228a = "KEY_7"
0x228b = "KEY_8"
0x22c4 = "KEY_9"
0x2287 = "KEY_0"
0x22da = "KEY_NUMERIC_POUND"  # #
0x22d0 = "KEY_NUMERIC_STAR"   # *

0x228c = "KEY_PAGEDOWN"
0x22dd = "KEY_PAGEUP"
0x22cd = "KEY_F6"
0x2291 = "KEY_F7"
0x2283 = "KEY_F8"
0x22c3 = "KEY_F9"
0x22c5 = "KEY_HELP"
0x22c0 = "KEY_BACKSPACE"
0x22cb = "KEY_BACKSPACE"
0x22d6 = "KEY_TEXT"
0x22d9 = "KEY_PLAYPAUSE"
0x2289 = "KEY_BLUE"
0x2284 = "KEY_YELLOW"
0x2296 = "KEY_F8"
0x2298 = "BTN_1"
