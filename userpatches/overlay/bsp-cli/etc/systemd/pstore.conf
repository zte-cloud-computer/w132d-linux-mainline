[PStore]
# ⚠️ Unlink=no 是**有意的**，不要改回 yes。
#
# systemd-pstore 归档完会 unlink /sys/fs/pstore/console-ramoops-0，
# 而 pstore 的 unlink → ramoops_pstore_erase() → persistent_ram_zap()
# 清的是**当前正在使用**的 console 环形区，不只是那条归档记录。
# 后果：每次开机约 5.5 s 时，CON_PRINTBUFFER 刚回放进去的
# 「0.000000 起的整段启动日志」被当场抹掉，console-ramoops 只能从 5.5 s 记起。
# 实测：Unlink=yes 时抓到的记录首行是 [5.534438]，而没触发归档那次是 [0.000000]。
# 而 0~5.5 s 正是早期 probe 挂死最容易发生、也最需要现场的窗口。
#
# 代价：/sys/fs/pstore 会一直非空，systemd-pstore 每次开机都跑一遍、
# 把同样的内容重新归档一次（约 45 KB 写入，可忽略）。dmesg 槽位仍是环形覆盖
# （ramoops_pstore_write 每次开机从 slot 0 重新开始写），不会写满卡死。
Unlink=no
