# drop-in 而不是替换 /etc/systemd/pstore.conf：那个文件归 systemd 包，整文件替换 dpkg 装不上。

[PStore]
# Unlink=no 是有意的：unlink console-ramoops-0 会走 ramoops_pstore_erase() -> persistent_ram_zap()，
# 清掉的是当前正在用的 console 环形区，开机 0~5.5 s 刚回放进去的启动日志当场丢失，
# 而那正是早期 probe 挂死最需要现场的窗口。代价只是每次开机重复归档约 45 KB。
Unlink=no
