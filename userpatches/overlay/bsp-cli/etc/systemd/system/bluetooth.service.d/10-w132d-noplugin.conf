# 禁用 BlueZ 的经典 HID 与 BLE HID-over-GATT 两个独立插件。
#
# 这支遥控器不响应 HID Report Map (0x2A4B) 读取。BlueZ 5.82 中经典 HID
# 插件名为 input，BLE HoG 插件名为 hog；只禁用 input 不会阻止 hog-lib
# 订阅 Report 特征并在最后读取 0x2A4B，链路仍会被 ATT 30 秒超时拖死。
# 输入和语音均由 w132d-ble-remote.py 直接通过 GATT + uhid 处理。
# 必须等 w132d-btattach 把 /dev/ttyBT0 挂成 hci0 之后再起 bluetoothd。
# （早先这里指向 w132d-bt-calib.service，那个 unit 已被 btattach 取代并删除；
# Requires 一个不存在的 unit 会让 bluetooth.service 整个起不来。）
[Unit]
Requires=w132d-bluetooth.service
After=w132d-bluetooth.service

[Service]
ExecStart=
ExecStart=/usr/libexec/bluetooth/bluetoothd --noplugin=input,hog
