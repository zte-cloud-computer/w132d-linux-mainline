# systemd-pstore 用 ConditionDirectoryNotEmpty=/sys/fs/pstore 判断要不要跑，
# 而它是 DefaultDependencies=no + Before=sysinit.target 的极早期单元 ——
# 比 udev 按 of alias 自动加载 ramoops.ko 早得多，于是永远看到空目录、永远跳过，
# 崩溃转储就一直烂在 /sys/fs/pstore 里不归档（11 个槽位满了会循环覆盖）。
#
# 照抄这个单元自己对 efi_pstore 的写法：先把模块拉起来再评估条件。
[Unit]
Wants=modprobe@ramoops.service
After=modprobe@ramoops.service
