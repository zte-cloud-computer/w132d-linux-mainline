# W132D 默认音频设备。声卡编号随探测顺序变，一律按卡名绑定：
#   rk3528acodec    片内 DAC -> LINEOUT -> 3.5mm 输出
#   rockchippdmmica ES7202 模拟麦 -> PDM -> 麦克风输入
# 录音套一层 softvol：ES7202 的模拟 PGA 只到 36 dB，耳麦说话峰值只有约 -48 dBFS，补 20 dB 数字增益。
# 调整：amixer -c rockchippdmmica sset "Mic Boost" 80% && alsactl store；原始信号用 plughw:CARD=rockchippdmmica。

pcm.micboost {
    type softvol
    slave.pcm "plughw:CARD=rockchippdmmica,DEV=0"
    control {
        name "Mic Boost"
        card rockchippdmmica
    }
    min_dB -20.0
    max_dB 20.0
    resolution 81
}

pcm.!default {
    type asym
    playback.pcm "plughw:CARD=rk3528acodec,DEV=0"
    capture.pcm  "micboost"
}

ctl.!default {
    type hw
    card rk3528acodec
}
